<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>喵圈</title>
    <script>
      // 首屏防白闪：在 body 渲染前就把 data-theme 写到 <html> 上
      (function () {
        try {
          var raw = window.localStorage.getItem('theme')
          var code = raw ? JSON.parse(raw).code : null
          document.documentElement.dataset.theme = code || 'sakura'
        } catch (e) {
          document.documentElement.dataset.theme = 'sakura'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
